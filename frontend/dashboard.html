<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeLine - Donor Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            min-height: 100vh;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: #d32f2f;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        #logoutButton {
            background: white;
            color: #d32f2f;

            border: none;
            padding: 10px 18px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: bold;
        }

        #logoutButton:hover {
            background: #eeeeee;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 1100px;

            margin: 40px auto;

            padding: 0 20px;
        }


        /* =========================
           WELCOME
        ========================= */

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h2 {
            color: #333;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #666;
        }


        /* =========================
           PROFILE CARD
        ========================= */

        .profile-card {

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);

            margin-bottom: 30px;
        }

        .profile-card h3 {
            color: #d32f2f;
            margin-bottom: 20px;
        }


        /* =========================
           PROFILE GRID
        ========================= */

        .profile-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;
        }

        .profile-item {

            background: #f8f8f8;

            padding: 18px;

            border-radius: 10px;
        }

        .profile-item span {

            display: block;

            color: #777;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .profile-item strong {

            font-size: 16px;

            color: #333;
        }


        /* =========================
           BLOOD GROUP
        ========================= */

        .blood-group {

            color: #d32f2f !important;

            font-size: 22px !important;

        }


        /* =========================
           STATUS CARDS
        ========================= */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));

            gap: 20px;

            margin-bottom: 30px;
        }

        .card {

            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        .card h3 {

            color: #555;

            margin-bottom: 10px;
        }

        .card p {

            color: #777;

        }


        /* =========================
           LOADING
        ========================= */

        #loading {

            text-align: center;

            padding: 40px;

            color: #666;
        }


        /* =========================
           ERROR
        ========================= */

        #error {

            display: none;

            background: #ffebee;

            color: #c62828;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 20px;
        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>🩸 LifeLine</h1>

        <button id="logoutButton">
            Logout
        </button>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">


        <div id="loading">
            Loading your profile...
        </div>


        <div id="error"></div>


        <section id="dashboardContent" style="display:none;">


            <!-- Welcome -->

            <div class="welcome">

                <h2>
                    Welcome, <span id="donorName"></span> 👋
                </h2>

                <p>
                    Thank you for being a LifeLine blood donor.
                </p>

            </div>


            <!-- =========================
                 QUICK CARDS
            ========================= -->

            <div class="cards">


                <div class="card">

                    <h3>🩸 Blood Group</h3>

                    <p id="bloodGroupCard">
                        --
                    </p>

                </div>


                <div class="card">

                    <h3>📍 Location</h3>

                    <p id="locationCard">
                        --
                    </p>

                </div>


                <div class="card">

                    <h3>📅 Last Donation</h3>

                    <p id="lastDonationCard">
                        --
                    </p>

                </div>


            </div>


            <!-- =========================
                 PROFILE
            ========================= -->

            <div class="profile-card">

                <h3>👤 Donor Profile</h3>


                <div class="profile-grid">


                    <div class="profile-item">

                        <span>Name</span>

                        <strong id="profileName">
                            --
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Email</span>

                        <strong id="profileEmail">
                            --
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Age</span>

                        <strong id="profileAge">
                            --
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Blood Group</span>

                        <strong
                            id="profileBloodGroup"
                            class="blood-group">

                            --

                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Phone</span>

                        <strong id="profilePhone">
                            --
                        </strong>

                    </div>


                    <div class="profile-item">

                        <span>Location</span>

                        <strong id="profileLocation">
                            --
                        </strong>

                    </div>


                </div>

            </div>


        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        // =========================
        // GET TOKEN
        // =========================

        const token =
            localStorage.getItem("lifelineToken");


        // =========================
        // CHECK LOGIN
        // =========================

        if (!token) {

            window.location.href =
                "login.html";

        }


        // =========================
        // LOAD DONOR PROFILE
        // =========================

        async function loadDonorProfile() {

            try {

                const response =
                    await fetch(
                        "http://localhost:5000/api/donor/profile",
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                const data =
                    await response.json();


                // =========================
                // INVALID TOKEN
                // =========================

                if (!response.ok) {

                    localStorage.removeItem(
                        "lifelineToken"
                    );

                    localStorage.removeItem(
                        "lifelineUser"
                    );

                    window.location.href =
                        "login.html";

                    return;
                }


                // =========================
                // DONOR DATA
                // =========================

                const donor =
                    data.donor;


                // Welcome

                document.getElementById(
                    "donorName"
                ).textContent =
                    donor.name;


                // Quick cards

                document.getElementById(
                    "bloodGroupCard"
                ).textContent =
                    donor.blood_group;


                document.getElementById(
                    "locationCard"
                ).textContent =
                    donor.location;


                document.getElementById(
                    "lastDonationCard"
                ).textContent =
                    donor.last_donation_date ||
                    "Not donated yet";


                // Profile

                document.getElementById(
                    "profileName"
                ).textContent =
                    donor.name;


                document.getElementById(
                    "profileEmail"
                ).textContent =
                    donor.email;


                document.getElementById(
                    "profileAge"
                ).textContent =
                    donor.age;


                document.getElementById(
                    "profileBloodGroup"
                ).textContent =
                    donor.blood_group;


                document.getElementById(
                    "profilePhone"
                ).textContent =
                    donor.phone;


                document.getElementById(
                    "profileLocation"
                ).textContent =
                    donor.location;


                // Hide loading

                document.getElementById(
                    "loading"
                ).style.display =
                    "none";


                // Show dashboard

                document.getElementById(
                    "dashboardContent"
                ).style.display =
                    "block";


            } catch (error) {

                console.error(
                    "Profile Error:",
                    error
                );


                document.getElementById(
                    "loading"
                ).style.display =
                    "none";


                const errorBox =
                    document.getElementById(
                        "error"
                    );


                errorBox.style.display =
                    "block";


                errorBox.textContent =
                    "Unable to connect to LifeLine server.";

            }

        }


        // =========================
        // LOGOUT
        // =========================

        document.getElementById(
            "logoutButton"
        ).addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "lifelineToken"
                );

                localStorage.removeItem(
                    "lifelineUser"
                );

                window.location.href =
                    "login.html";

            }
        );


        // =========================
        // START
        // =========================

        loadDonorProfile();


    </script>

</body>

</html>
